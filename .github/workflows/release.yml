name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同じタグで再実行された場合に publish が二重に走らないようにする
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # タグと package.json の version が食い違うと、latest.yml が指すファイル名と
      # 実ファイル名がずれて自動アップデートが壊れる。ビルド前に止める。
      - name: Verify tag matches package.json version
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($pkg -ne $tag) {
            Write-Error "tag ${{ github.ref_name }} does not match package.json version $pkg"
            exit 1
          }
          Write-Host "version OK: $pkg"

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # ドラフトを先に確定させる。electron-builder の getOrCreateRelease は
      # 「一覧取得 → 無ければ作成」なので、環境によっては同一タグのドラフトが
      # 二重にできうる。ここで1つだけ作っておけば、publish はそれを再利用する。
      - name: Ensure exactly one draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" --draft --verify-tag `
              --title "${{ github.ref_name }}" `
              --notes "Movie Creator Studio ${{ github.ref_name }}"
          } else {
            Write-Host "release ${{ github.ref_name }} already exists - reusing it"
          }

      - name: Build installer and publish to GitHub Releases
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 必須アセットが欠けたドラフトを公開すると、ダウンロード不能(exe 欠落)
      # または自動更新不能(latest.yml 欠落)なリリースが出回るため失敗させる。
      # .blockmap は差分ダウンロードの最適化専用で、無い場合 electron-updater は
      # フルダウンロードにフォールバックする(NsisUpdater の
      # differentialDownloadInstaller は失敗時 true を返し全体を取得する)ため
      # 必須にはせず警告のみ。なお別ファイル方式では latest.yml に blockMapSize
      # が入らないのが正常(埋め込み方式のみ付与される)。
      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          $names = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          Write-Host "uploaded assets:"
          $names | ForEach-Object { Write-Host "  - $_" }
          foreach ($want in @("Movie-Creator-Studio-Setup-$v.exe", "latest.yml")) {
            if ($names -notcontains $want) {
              Write-Error "missing required release asset: $want"
              exit 1
            }
          }
          $bm = "Movie-Creator-Studio-Setup-$v.exe.blockmap"
          if ($names -notcontains $bm) {
            Write-Host "::warning::$bm is missing - updates will download the full installer instead of a delta"
          }
          Write-Host "required assets present"
